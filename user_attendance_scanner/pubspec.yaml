name: user_attendance_scanner
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  flutter_zkteco: ^1.1.0
  usb_serial: ^0.5.2
  win32: ^4.1.4
  ffi: ^2.1.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.4+1
  path: ^1.9.0
  device_preview: ^1.3.1
  image_picker: ^1.1.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: TRTCENZODEMO
      fonts:
        - asset: assets/fonts/TRTCENZODEMO-SemiBold.ttf
          weight: 600
    - family: CEORUSE
      fonts:
        - asset: assets/fonts/ceoruse.otf
          weight: 500
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
